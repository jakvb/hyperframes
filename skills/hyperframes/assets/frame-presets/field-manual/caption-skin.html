<!--
  Field Manual — caption skin (preset-local source).

  This is the preset's lower-third karaoke caption look: reference code to read or copy,
  not to mount as is. A copy used as compositions/captions.html fills its three reserved
  holes and wraps the fragment in a <template>:
    · the empty GROUPS array            → the engine's scene-aware word groups
    · the 0 duration + 0 width/height   → real total + canvas size
    · the empty data-brand-tokens style → :root tokens derived from the project's frame.md

  Token contract — reference ONLY this fixed vocab (set it from the project's frame.md;
  each var carries a field-manual literal fallback for standalone preview):
    --cap-ink · --cap-canvas · --cap-accent · --cap-accent-2 · --font-display ·
    --font-body · --cap-band-top · --cap-band-height

  Hooks (do not rename): .caption-group / .caption-word + states .is-active / .is-spoken,
  root data-composition-id="captions", timeline at window.__timelines["captions"].
  State changes use gsap.set({className}); never tl.call() callbacks.

  Visual: a paper-light plate with a 1px ink rule, no radius and no shadow. Lato reads at
  length; the active word gets a 4px vermilion underline. Upcoming words sit in muted ink,
  spoken words settle to full ink. The plate is a data plate, not a floating card.
-->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

<!-- the project's :root tokens go here -->
<style data-brand-tokens></style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the same band; exactly one is visible */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }
  .caption-plate {
    max-width: 82%;
    padding: 16px 28px 18px;
    background: var(--cap-canvas, #e7dfd2);
    border: 1px solid var(--cap-ink, #171512);
    border-radius: 0;
    box-shadow: none;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.08em 0.26em;
    font-family: var(--font-body, "Lato"), system-ui, sans-serif;
    font-weight: 400;
    font-size: clamp(38px, 4.2vw, 54px);
    line-height: 1.24;
    letter-spacing: 0;
  }
  /* upcoming — muted ink, no underline */
  .caption-word {
    display: inline-block;
    padding: 0 0.02em 0.05em;
    color: color-mix(in srgb, var(--cap-ink, #171512) 42%, var(--cap-canvas, #e7dfd2));
    border-bottom: 4px solid transparent;
  }
  /* current word — full ink with the vermilion measure mark */
  .caption-word.is-active {
    color: var(--cap-ink, #171512);
    border-bottom: 4px solid var(--cap-accent, #cf431c);
  }
  /* already spoken — solid ink, underline cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #171512);
    border-bottom: 4px solid transparent;
  }
  /* optional word classes, dormant until a word-classer tags them */
  .caption-word.cap-brand {
    color: var(--cap-accent, #cf431c);
  }
  .caption-word.cap-brand.is-active {
    border-bottom: 4px solid var(--cap-accent, #cf431c);
  }
  .caption-word.cap-num {
    font-family: var(--font-display, "IBM Plex Mono"), ui-monospace, monospace;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .caption-word.cap-cta {
    border-bottom: 4px solid var(--cap-accent-2, #124b46);
    color: var(--cap-ink, #171512);
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-plate {
      max-width: 94%;
    }
    .caption-line {
      font-size: clamp(32px, 5.2vw, 44px);
    }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="0"
  data-fps="30"
  data-width="0"
  data-height="0"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // the scene-aware word groups + real duration go here.
  var GROUPS = [];
  var DURATION = 0;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var plate = document.createElement("div");
      plate.className = "caption-plate";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      plate.appendChild(line);
      groupEl.appendChild(plate);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (resets on reverse seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>
